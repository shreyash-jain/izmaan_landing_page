  <circle cx="603" cy="1160" r="16" fill="#FF7A59"/><path d="M596 1153 l14 14 M610 1153 l-14 14" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="635" y="1170">A tar road to the door</text>
