<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1400" width="1080" height="1400" role="img" aria-labelledby="t d">
<title id="t">Beachfront lodge vs hotel in Mozambique</title>
<desc id="d">Beach: at a beachfront lodge it is minutes away all day; at a town hotel it is a trip you plan. Pace: set by the tide, or set by the hotel. Privacy: a handful of guests, or busier. Food: often self-catering, or a restaurant. Signal: often patchy, or usually reliable. Nearby: nature, or shops and bars. A beachfront lodge suits couples, divers and anglers, photographers, and families who don't need entertaining. Pick a hotel if you need steady Wi-Fi for work, restaurants nearby, or a tar road to the door.</desc>
<style>
  .h{font-family:Poppins,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:700;fill:#0B3A40}
  .b{font-family:Poppins,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0B3A40}
  .w{font-family:Poppins,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:700;fill:#fff}
</style>
