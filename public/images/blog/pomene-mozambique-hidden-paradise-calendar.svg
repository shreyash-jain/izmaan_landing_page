<title id="t">Best time to visit Pomene, Mozambique</title>
<desc id="d">Year calendar: humpback whales June to November with a peak from late July to September; turtle nesting October to March with hatchlings from late December to March; cooler, drier months May to September; warmer, wetter months November to March; fishing, diving and snorkelling all year.</desc>
