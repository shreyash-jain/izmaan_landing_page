<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">7 reasons to visit Pomene, Mozambique in 2026–27</title>
<desc id="d">1. An empty beach: Most days, 100 m below the dune (All year · busier on cruise days); 2. Reef you can swim to: Snorkel straight from the beach (All year · clearest May–Sep); 3. Nesting turtles: Loggerheads and leatherbacks (Oct–Mar · hatchlings late Dec–Mar); 4. Humpback whales: Often seen from the deck (Jun–Nov · peak late Jul–Sep); 5. More than a beach: Mangroves, ruins, blowholes (All year · go early in summer); 6. Off-grid nights: Solar, patchy signal, dark skies (All year); 7. A self-catering base: 4 en-suite rooms, up to 8 guests (Catered add-ons: 2 weeks' notice).</desc>
