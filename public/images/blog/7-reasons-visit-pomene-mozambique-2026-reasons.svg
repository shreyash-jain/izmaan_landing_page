<text x="80" y="160" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#0B3A40" opacity="0.7">Pomene National Reserve, Inhambane, Mozambique · about 106 km south of Vilankulo</text>
