<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1296" width="1080" height="1296" role="img" aria-labelledby="t d">
<title id="t">Adventure on Mozambique's wild coast at Pomene</title>
<desc id="d">Snorkelling: All year, effort easy, mask, fins, reef-safe sunscreen; Diving: All year, effort moderate, bring your card. arrange a boat ahead; Fishing: All year, effort moderate, recreational licence. your own tackle; Whale watching: Jun–Nov, effort easy, binoculars. watch from the dune; Turtle nesting: Oct–Mar, effort easy, at night, red-light torch. keep well back; Mangrove kayak: Rising tide, effort moderate, tide times, water, a hat; Ruins &amp; blowholes: All year, effort easy, camera. go early, before the heat; The sand track in: Daylight only, effort hard, high-clearance 4×4, tyre gauge.</desc>
