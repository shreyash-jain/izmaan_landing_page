<title id="t">Planning a Pomene trip: October 2026 to September 2027</title>
<desc id="d">Turtle nesting October 2026 to March 2027, hatchlings from late December to March; MSC cruise season from 27 November 2026 to early April 2027; humpback whales June to November 2027, peaking late July to September; cooler, drier months May to September 2027; fishing, diving and snorkelling all year.</desc>
