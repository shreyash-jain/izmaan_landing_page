<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1400" width="1080" height="1400" role="img" aria-labelledby="t d">
<title id="t">A day on a remote beach holiday in Mozambique</title>
<desc id="d">Timeline of a typical day at Pomene: sunrise over the Indian Ocean; an early beach walk; snorkelling, swimming or fishing on the reef close to shore; a slow self-catered lunch; afternoon in the mangroves, the old hotel ruins or the blowholes; sunset on the deck; a dark night of stars and, October to March, nesting turtles.</desc>
<style>
  .h{font-family:Poppins,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:700;fill:#0B3A40}
  .b{font-family:Poppins,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0B3A40}
  .p{font-family:Poppins,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:700;fill:#fff;font-size:26px}
</style>
<rect width="1080" height="1400" fill="#FBF7EF"/>
<text x="70" y="110" class="h" font-size="52">A day in Pomene</text>
<text x="70" y="160" class="b" font-size="28" opacity="0.7">What a remote beach holiday in Mozambique actually looks like</text>

<!-- spine -->
<line x1="300" y1="230" x2="300" y2="1250" stroke="#16B5AC" stroke-width="6" stroke-dasharray="2 14" stroke-linecap="round"/>

<!-- 1 sunrise -->
<g transform="translate(0,230)">
  <rect x="70" y="22" width="150" height="46" rx="23" fill="#FF7A59"/><text x="145" y="54" class="p" text-anchor="middle">Dawn</text>
  <circle cx="300" cy="45" r="52" fill="#fff" stroke="#16B5AC" stroke-width="5"/>
  <path d="M268 58 A32 32 0 0 1 332 58 Z" fill="#FF7A59"/><line x1="262" y1="62" x2="338" y2="62" stroke="#16B5AC" stroke-width="5" stroke-linecap="round"/>
  <text x="385" y="38" class="h" font-size="34">Sunrise off the water</text>
  <text x="385" y="80" class="b" font-size="26">The lodge faces the Indian Ocean. Coffee, no alarm.</text>
</g>
<!-- 2 walk -->
<g transform="translate(0,385)">
  <rect x="70" y="22" width="150" height="46" rx="23" fill="#FF7A59"/><text x="145" y="54" class="p" text-anchor="middle">Early</text>
  <circle cx="300" cy="45" r="52" fill="#fff" stroke="#16B5AC" stroke-width="5"/>
  <ellipse cx="288" cy="30" rx="9" ry="14" fill="#0B3A40"/><ellipse cx="312" cy="58" rx="9" ry="14" fill="#0B3A40"/>
  <text x="385" y="38" class="h" font-size="34">Beach walk</text>
  <text x="385" y="80" class="b" font-size="26">100 m down the dune. Shells, crabs, turtle tracks.</text>
</g>
<!-- 3 water -->
<g transform="translate(0,540)">
  <rect x="70" y="22" width="150" height="46" rx="23" fill="#FF7A59"/><text x="145" y="54" class="p" text-anchor="middle">Morning</text>
  <circle cx="300" cy="45" r="52" fill="#fff" stroke="#16B5AC" stroke-width="5"/>
  <rect x="270" y="28" width="60" height="30" rx="12" fill="#16B5AC"/><rect x="278" y="34" width="20" height="18" rx="6" fill="#EAF6F5"/><rect x="302" y="34" width="20" height="18" rx="6" fill="#EAF6F5"/>
  <text x="385" y="38" class="h" font-size="34">In the water</text>
  <text x="385" y="80" class="b" font-size="26">Reef close to shore. Snorkel, swim, fish, kite.</text>
</g>
<!-- 4 lunch -->
<g transform="translate(0,695)">
  <rect x="70" y="22" width="150" height="46" rx="23" fill="#FF7A59"/><text x="145" y="54" class="p" text-anchor="middle">Midday</text>
  <circle cx="300" cy="45" r="52" fill="#fff" stroke="#16B5AC" stroke-width="5"/>
  <path d="M265 45 Q290 22 318 45 Q290 68 265 45 Z" fill="#16B5AC"/><path d="M318 45 L338 30 L338 60 Z" fill="#16B5AC"/><circle cx="278" cy="42" r="3" fill="#fff"/>
  <text x="385" y="38" class="h" font-size="34">A slow lunch</text>
  <text x="385" y="80" class="b" font-size="26">Self-catering. Cook the catch, eat when you like.</text>
</g>
<!-- 5 explore -->
<g transform="translate(0,850)">
  <rect x="70" y="22" width="150" height="46" rx="23" fill="#FF7A59"/><text x="145" y="54" class="p" text-anchor="middle">Afternoon</text>
  <circle cx="300" cy="45" r="52" fill="#fff" stroke="#16B5AC" stroke-width="5"/>
  <line x1="300" y1="72" x2="300" y2="34" stroke="#3D6B4F" stroke-width="5"/><line x1="300" y1="72" x2="286" y2="82" stroke="#3D6B4F" stroke-width="3"/><line x1="300" y1="72" x2="314" y2="82" stroke="#3D6B4F" stroke-width="3"/><circle cx="300" cy="28" r="20" fill="#4E8A5E"/>
  <text x="385" y="38" class="h" font-size="34">Go exploring</text>
  <text x="385" y="80" class="b" font-size="26">Mangroves, the 1963 hotel ruins, the blowholes.</text>
</g>
<!-- 6 sunset -->
<g transform="translate(0,1005)">
  <rect x="70" y="22" width="150" height="46" rx="23" fill="#FF7A59"/><text x="145" y="54" class="p" text-anchor="middle">Dusk</text>
  <circle cx="300" cy="45" r="52" fill="#FF7A59" stroke="#16B5AC" stroke-width="5"/>
  <path d="M272 58 A28 28 0 0 1 328 58 Z" fill="#FBF7EF"/><line x1="262" y1="62" x2="338" y2="62" stroke="#FBF7EF" stroke-width="5" stroke-linecap="round"/>
  <text x="385" y="38" class="h" font-size="34">Sunset on the deck</text>
  <text x="385" y="80" class="b" font-size="26">The bay changes colour. Nowhere else to be.</text>
</g>
<!-- 7 night -->
<g transform="translate(0,1160)">
  <rect x="70" y="22" width="150" height="46" rx="23" fill="#0B3A40"/><text x="145" y="54" class="p" text-anchor="middle">Night</text>
  <circle cx="300" cy="45" r="52" fill="#0B3A40" stroke="#16B5AC" stroke-width="5"/>
  <path d="M310 22 A26 26 0 1 0 322 64 A20 20 0 1 1 310 22 Z" fill="#FBF7EF"/><circle cx="276" cy="30" r="3" fill="#FBF7EF"/><circle cx="268" cy="58" r="2.5" fill="#FBF7EF"/>
  <text x="385" y="38" class="h" font-size="34">A properly dark sky</text>
  <text x="385" y="80" class="b" font-size="26">Stars, surf, and nesting turtles from Oct to Mar.</text>
</g>

<text x="70" y="1365" class="b" font-size="22" opacity="0.6">Izmaan Lodge · Pomene, Inhambane, Mozambique</text>
</svg>
