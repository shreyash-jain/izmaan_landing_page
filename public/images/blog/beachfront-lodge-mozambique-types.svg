<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1480" width="1080" height="1480" role="img" aria-labelledby="t d">
<title id="t">Beachfront, oceanfront, ocean view or near the beach: what the labels mean</title>
<desc id="d">A cross-section from the Indian Ocean inland. Beachfront: a building on the sand, no road or property in between, view not guaranteed. Oceanfront: faces the sea directly and can sit on a dune or cliff; Izmaan Lodge is here, on the dune at Pomene about 100 m above the sand with no road between. Ocean view: you can see the sea, sometimes only a slice, and the beach may be a walk or drive away. Near the beach: a short walk or drive, often with no view. Further inland, you drive to the beach.</desc>
<style>
  .h{font-family:Poppins,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:700;fill:#0B3A40}
  .b{font-family:Poppins,'Segoe UI',Helvetica,Arial,sans-serif;fill:#0B3A40}
  .w{font-family:Poppins,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:700;fill:#fff}
</style>
<rect width="1080" height="1480" fill="#FBF7EF"/>
<text x="70" y="110" class="h" font-size="48">Beachfront or ocean view?</text>
<text x="70" y="158" class="b" font-size="28" opacity="0.7">What the labels mean, from the sea to the road</text>

<!-- cross-section -->
<clipPath id="panel"><rect x="40" y="200" width="1000" height="520" rx="28"/></clipPath>
<g clip-path="url(#panel)">
  <rect x="40" y="200" width="1000" height="520" fill="#E3F3F6"/>
  <!-- sea -->
  <rect x="40" y="560" width="300" height="160" fill="#2BA6B5"/>
  <path d="M40 560 q25 -12 50 0 t50 0 t50 0 t50 0 t50 0 t50 0" stroke="#fff" stroke-width="4" fill="none" opacity="0.7"/>
  <!-- land: beach, dune, back slope, flat -->
  <path d="M300 572 L440 548 Q500 500 540 440 Q600 400 660 440 Q710 500 740 560 L1040 560 L1040 720 L300 720 Z" fill="#EBD9B4"/>
  <path d="M520 470 q10 -14 20 0 M600 418 q10 -14 20 0 M680 470 q10 -14 20 0" stroke="#7FA36A" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- road -->
  <rect x="760" y="556" width="90" height="14" fill="#55646A"/>
  <path d="M770 563 h14 M800 563 h14 M830 563 h14" stroke="#fff" stroke-width="3"/>
  <text x="805" y="600" class="b" font-size="20" text-anchor="middle" opacity="0.8">road</text>

  <!-- 1 beachfront hut on the sand -->
  <rect x="385" y="516" width="56" height="36" fill="#fff" stroke="#0B3A40" stroke-width="3"/>
  <path d="M376 518 L413 492 L450 518 Z" fill="#C79A5A" stroke="#0B3A40" stroke-width="3"/>
  <!-- 2 Izmaan on dune -->
  <rect x="540" y="398" width="100" height="34" fill="#fff" stroke="#0B3A40" stroke-width="3"/>
  <rect x="540" y="418" width="100" height="6" fill="#2F6FD6"/>
  <path d="M530 400 L565 376 L600 400 Z M585 400 L620 376 L652 400 Z" fill="#C79A5A" stroke="#0B3A40" stroke-width="3"/>
  <!-- 3 ocean view tower across the road -->
  <rect x="870" y="240" width="70" height="320" fill="#fff" stroke="#0B3A40" stroke-width="3"/>
  <g fill="#9CC9D1"><rect x="882" y="255" width="18" height="18"/><rect x="910" y="255" width="18" height="18"/><rect x="882" y="285" width="18" height="18"/><rect x="910" y="285" width="18" height="18"/><rect x="882" y="320" width="18" height="18"/><rect x="910" y="320" width="18" height="18"/><rect x="882" y="355" width="18" height="18"/><rect x="910" y="355" width="18" height="18"/><rect x="882" y="390" width="18" height="18"/><rect x="910" y="390" width="18" height="18"/><rect x="882" y="425" width="18" height="18"/><rect x="910" y="425" width="18" height="18"/><rect x="882" y="460" width="18" height="18"/><rect x="910" y="460" width="18" height="18"/></g>
  <path d="M870 250 L80 555" stroke="#16B5AC" stroke-width="3" stroke-dasharray="10 8"/>
  <!-- 4 near the beach house -->
  <rect x="965" y="520" width="56" height="40" fill="#fff" stroke="#0B3A40" stroke-width="3"/>
  <path d="M957 522 L993 498 L1029 522 Z" fill="#C79A5A" stroke="#0B3A40" stroke-width="3"/>

  <!-- 100 m marker -->
  <path d="M440 640 H560" stroke="#0B3A40" stroke-width="3"/>
  <path d="M440 628 v24 M560 628 v24" stroke="#0B3A40" stroke-width="3"/>
  <text x="500" y="680" class="h" font-size="22" text-anchor="middle">about 100 m</text>
  <text x="170" y="660" class="w" font-size="24" text-anchor="middle">Indian Ocean</text>
</g>

<!-- number pins -->
<g>
  <circle cx="413" cy="455" r="22" fill="#FF7A59"/><text x="413" y="464" class="w" font-size="24" text-anchor="middle">1</text>
  <circle cx="590" cy="338" r="22" fill="#16B5AC"/><text x="590" y="347" class="w" font-size="24" text-anchor="middle">2</text>
  <circle cx="985" cy="290" r="22" fill="#0B3A40"/><text x="985" y="299" class="w" font-size="24" text-anchor="middle">3</text>
  <circle cx="993" cy="460" r="22" fill="#8A8F6A"/><text x="993" y="469" class="w" font-size="24" text-anchor="middle">4</text>
</g>
<rect x="490" y="236" width="200" height="50" rx="25" fill="#16B5AC"/>
<text x="590" y="270" class="w" font-size="24" text-anchor="middle">Izmaan Lodge</text>
<path d="M590 286 V314" stroke="#16B5AC" stroke-width="4"/>

<!-- cards -->
<g>
  <rect x="40" y="760" width="485" height="300" rx="24" fill="#FFEDE7"/>
  <circle cx="92" cy="814" r="24" fill="#FF7A59"/><text x="92" y="823" class="w" font-size="24" text-anchor="middle">1</text>
  <text x="130" y="826" class="h" font-size="32">Beachfront</text>
  <g class="b" font-size="25"><text x="72" y="890">Walk straight onto the sand.</text><text x="72" y="935">No road or property between.</text><text x="72" y="980">A view is not guaranteed.</text></g>

  <rect x="555" y="760" width="485" height="300" rx="24" fill="#EAF6F5" stroke="#16B5AC" stroke-width="4"/>
  <circle cx="607" cy="814" r="24" fill="#16B5AC"/><text x="607" y="823" class="w" font-size="24" text-anchor="middle">2</text>
  <text x="645" y="826" class="h" font-size="32">Oceanfront</text>
  <g class="b" font-size="25"><text x="587" y="890">Faces the sea directly.</text><text x="587" y="935">Can sit on a dune or cliff.</text><text x="587" y="980" font-weight="700">Izmaan: on the dune, about</text><text x="587" y="1020" font-weight="700">100 m to the sand, no road.</text></g>

  <rect x="40" y="1090" width="485" height="270" rx="24" fill="#E6ECEE"/>
  <circle cx="92" cy="1144" r="24" fill="#0B3A40"/><text x="92" y="1153" class="w" font-size="24" text-anchor="middle">3</text>
  <text x="130" y="1156" class="h" font-size="32">Ocean view</text>
  <g class="b" font-size="25"><text x="72" y="1220">You can see the sea.</text><text x="72" y="1265">The whole bay, or a slice.</text><text x="72" y="1310">The beach may be a drive.</text></g>

  <rect x="555" y="1090" width="485" height="270" rx="24" fill="#F0EFE4"/>
  <circle cx="607" cy="1144" r="24" fill="#8A8F6A"/><text x="607" y="1153" class="w" font-size="24" text-anchor="middle">4</text>
  <text x="645" y="1156" class="h" font-size="32">Near the beach</text>
  <g class="b" font-size="25"><text x="587" y="1220">A short walk or drive.</text><text x="587" y="1265">Often no view at all.</text><text x="587" y="1310">Inland: you drive to the sea.</text></g>
</g>

<text x="540" y="1420" class="b" font-size="24" text-anchor="middle" opacity="0.75">Always ask: how far, what's in between, which water it faces</text>
<text x="540" y="1458" class="h" font-size="20" text-anchor="middle" opacity="0.6">izmaanlodge.co</text>
</svg>
